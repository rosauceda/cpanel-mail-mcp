[project]
name = "cpanel-mail-dmf"
version = "0.7.2"
description = "MCPB bundle for cpanel-mail-mcp (UID-safe 0.7.1+, vendored in src/)"
requires-python = ">=3.10"
# El paquete cpanel_mail_mcp va incluido en src/cpanel_mail_mcp/ (build.sh lo
# copia de ../src) porque PyPI solo tiene 0.7.0, que confunde numeros de
# secuencia con UIDs y mueve/borra el correo equivocado. Aqui solo van sus
# dependencias.
dependencies = [
    "mcp[cli]>=1.28,<2",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.8.0",
]

# Sin [build-system]: uv lo trata como proyecto virtual e instala solo las
# dependencias, sin intentar construir este directorio como paquete.
